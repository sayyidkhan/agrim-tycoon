[package]
name = "agrim-tycoon"
version = "0.1.0"
description = "Agrim Tycoon desktop game"
authors = ["Agrim Tycoon"]
edition = "2021"

[lib]
name = "agrim_tycoon_lib"
# The distributable target is macOS desktop; mobile crate formats are not needed here.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
