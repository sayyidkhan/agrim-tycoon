<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script>
      window.gsap = window.gsap || {
        timeline: function () {
          const timeline = {
            to: function () { return timeline; }, fromTo: function () { return timeline; },
            set: function () { return timeline; }, duration: function () { return 60; },
            totalDuration: function () { return 60; }, time: function () { return timeline; },
            pause: function () { return timeline; }, play: function () { return timeline; }, kill: function () {}
          };
          return timeline;
        }
      };
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f2efe8;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-qbnw" id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1920" data-height="1080">
      <div data-hf-id="hf-oedr" id="el-01-welcome" class="scene" data-composition-id="01-welcome" data-composition-src="compositions/frames/01-welcome.html" data-start="0" data-duration="15.6" data-track-index="0"></div>

      <div data-hf-id="hf-d1dr" id="el-02-vision" class="scene" data-composition-id="02-vision" data-composition-src="compositions/frames/02-vision.html" data-start="15" data-duration="20" data-track-index="1"></div>

      <div data-hf-id="hf-c1ug" id="el-03-dilemma" class="scene" data-composition-id="03-dilemma" data-composition-src="compositions/frames/03-dilemma.html" data-start="35" data-duration="12.5" data-track-index="0"></div>

      <div data-hf-id="hf-fvav" id="el-04-gemma" class="scene" data-composition-id="04-gemma" data-composition-src="compositions/frames/04-gemma.html" data-start="47" data-duration="8" data-track-index="1"></div>

      <div data-hf-id="hf-pyxc" id="el-05-play" class="scene" data-composition-id="05-play" data-composition-src="compositions/frames/05-play.html" data-start="55" data-duration="5" data-track-index="0"></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-welcome", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 15);
        tl.fromTo("#el-02-vision", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 15);
        tl.to("#el-03-dilemma", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 47);
        tl.fromTo("#el-04-gemma", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 47);
        tl.to({}, { duration: 60 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
